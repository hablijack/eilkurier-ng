# Eilkurier – Compose-Datei zum Kopieren (openmediavault-Compose-Plugin oder `docker compose up -d`).
# Alle Einstellungen stehen unten bei "x-settings". Vor dem ersten Start mindestens die mit ÄNDERN
# markierten Werte anpassen. Ablauf: postgres → migrate (einmalig) → app (Weboberfläche) + worker.
name: eilkurier

x-settings: &settings
  TZ: Europe/Berlin
  # ÄNDERN: Datenbank-Passwort, derselbe Wert wie unten bei postgres → POSTGRES_PASSWORD
  EILKURIER_DATABASE_URL: postgresql+psycopg://eilkurier:bitte-aendern@postgres:5432/eilkurier
  # ÄNDERN: lange Zufallszeichenkette (signiert die Anmelde-Cookies), z. B. `openssl rand -hex 32`
  EILKURIER_SECRET_KEY: bitte-lange-zufaellige-zeichenkette
  # leer = Weboberfläche ohne PIN
  EILKURIER_HOUSEHOLD_PIN: ""
  EILKURIER_TIMEZONE: Europe/Berlin
  # Sprache, in der der Reporter schreibt (de|en)
  EILKURIER_LANGUAGE: de
  # Ort für Wetter (DWD) und Sonnenzeiten
  EILKURIER_LOCATION_NAME: Musterstadt
  EILKURIER_LATITUDE: "49.45"
  EILKURIER_LONGITUDE: "11.86"
  # Sprachmodell auf dem Jetson (llama.cpp, deploy/jetson/); leer = Zeitungen nur mit Auszügen
  EILKURIER_LLM_URL: http://jetson.fritz.box:8080
  EILKURIER_LLM_MODEL: qwen3.5-9b
  EILKURIER_EMBEDDING_MODEL: embeddinggemma
  # Telegram-Bot-Token von @BotFather; leer = kein Telegram
  EILKURIER_TELEGRAM_BOT_TOKEN: ""
  # E-Mail-Versand; leerer Host = keine E-Mail
  EILKURIER_SMTP_HOST: ""
  EILKURIER_SMTP_PORT: "587"
  EILKURIER_SMTP_USER: ""
  EILKURIER_SMTP_PASSWORD: ""
  EILKURIER_SMTP_FROM: Eilkurier <eilkurier@example.org>
  EILKURIER_SMTP_STARTTLS: "true"

x-eilkurier: &eilkurier
  # Genaue Version (siehe CHANGELOG.md). Update: Nummer erhöhen, dann im Plugin "Pull" und "Up".
  image: hablijack/eilkurier-ng:0.2.0
  restart: unless-stopped
  environment: *settings
  # Zustandslos: Root-Dateisystem schreibgeschützt, keine Rechte; alles liegt in Postgres.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *eilkurier
    restart: "no"
    command: ["eilkurier", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *eilkurier
    ports:
      # Weboberfläche: http://<rechner>:8095 (linke Zahl ändern, falls der Port belegt ist;
      # 8080 ist auf Servern oft schon vergeben)
      - "8095:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    <<: *eilkurier
    command: ["eilkurier", "worker"]
    stop_grace_period: 60s
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: eilkurier
      POSTGRES_USER: eilkurier
      # ÄNDERN: derselbe Wert wie oben in EILKURIER_DATABASE_URL
      POSTGRES_PASSWORD: bitte-aendern
    # Bewusst klein: der Pi teilt sich CPU und RAM mit anderen Diensten.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c max_connections=20
    volumes:
      # Docker-Volume (läuft überall). Auf der SSD statt dessen z. B.:
      # - /srv/dev-disk-by-uuid-XXXX/appdata/eilkurier/db:/var/lib/postgresql/data
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eilkurier -d eilkurier"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  db:

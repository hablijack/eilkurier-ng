    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d8fb0"/><stop offset="1" stop-color="#2f5b78"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1290" cy="170" r="70" fill="#fff4c9"/>

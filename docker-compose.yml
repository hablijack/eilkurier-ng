# Eilkurier – Betrieb im Heimnetz (z. B. openmediavault Compose-Plugin auf dem Raspberry Pi).
# Konfiguration über .env (Vorlage: .env.example). Ablauf beim Start:
#   postgres (gesund) → migrate (einmalig, beendet sich) → app (Weboberfläche/API) + worker (Pipeline)
# Demo/Entwicklung ohne Sprachmodell-Hardware:  docker compose --profile demo up
name: eilkurier

x-eilkurier: &eilkurier
  image: hablijack/eilkurier-ng:${EILKURIER_VERSION:-0.2.1}
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: ${TZ:-Europe/Berlin}
    EILKURIER_DATABASE_URL: postgresql+psycopg://eilkurier:${POSTGRES_PASSWORD}@postgres:5432/eilkurier
  # Stateless containers: read-only root filesystem, no privileges; all state lives in Postgres.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *eilkurier
    restart: "no"
    command: ["eilkurier", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *eilkurier
    ports:
      - "${EILKURIER_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    <<: *eilkurier
    command: ["eilkurier", "worker"]
    stop_grace_period: 60s
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      POSTGRES_DB: eilkurier
      POSTGRES_USER: eilkurier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    # Bewusst klein: der Pi teilt sich CPU und RAM mit anderen Diensten.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c max_connections=20
    volumes:
      - ${EILKURIER_DB_DIR:-db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eilkurier -d eilkurier"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # Nur mit --profile demo: simuliertes Sprachmodell (kein GPU nötig), für Vorführung und Tests.
  # Dazu in .env: EILKURIER_LLM_URL=http://simulator:11434
  simulator:
    <<: *eilkurier
    profiles: [demo]
    command: ["eilkurier", "simulator", "--port", "11434"]
    healthcheck:
      disable: true

volumes:
  db:

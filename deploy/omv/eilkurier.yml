# Eilkurier – Compose-Datei für das openmediavault-Compose-Plugin (Raspberry Pi "zeus").
#
# In der OMV-Oberfläche (Dienste → Compose → Dateien → Anlegen):
#   Name "eilkurier", diese Datei als "Datei", den Inhalt von eilkurier.env als "Umgebung".
# Das Plugin übergibt die Umgebung per --env-file; deshalb steht hier jeder Wert ausdrücklich
# (kein env_file:). Pflichtwerte ohne Vorgabe brechen den Start mit einer Meldung ab.
#
# Ablauf beim Start: postgres (gesund) → migrate (einmalig) → app (Weboberfläche/API) + worker.
# Das Sprachmodell läuft auf dem Jetson (deploy/jetson/), nie auf dem Pi.
name: eilkurier

x-eilkurier: &eilkurier
  image: hablijack/eilkurier-ng:${EILKURIER_VERSION:-latest}
  restart: unless-stopped
  environment: &eilkurier-env
    TZ: ${TZ:-Europe/Berlin}
    EILKURIER_DATABASE_URL: postgresql+psycopg://eilkurier:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}@postgres:5432/eilkurier
    # Haushalt
    EILKURIER_SECRET_KEY: ${EILKURIER_SECRET_KEY:?EILKURIER_SECRET_KEY setzen (lange Zufallszeichenkette)}
    EILKURIER_HOUSEHOLD_PIN: ${EILKURIER_HOUSEHOLD_PIN:-}
    EILKURIER_TIMEZONE: ${EILKURIER_TIMEZONE:-Europe/Berlin}
    EILKURIER_LANGUAGE: ${EILKURIER_LANGUAGE:-de}
    EILKURIER_LOCATION_NAME: ${EILKURIER_LOCATION_NAME:-Musterstadt}
    EILKURIER_LATITUDE: ${EILKURIER_LATITUDE:-49.45}
    EILKURIER_LONGITUDE: ${EILKURIER_LONGITUDE:-11.86}
    # Sprachmodell (Jetson, llama.cpp); leere URL = Zeitungen nur mit Auszügen
    EILKURIER_LLM_URL: ${EILKURIER_LLM_URL:-}
    EILKURIER_LLM_MODEL: ${EILKURIER_LLM_MODEL:-qwen3.5-9b}
    EILKURIER_EMBEDDING_MODEL: ${EILKURIER_EMBEDDING_MODEL:-embeddinggemma}
    EILKURIER_LLM_TIMEOUT_SECONDS: ${EILKURIER_LLM_TIMEOUT_SECONDS:-300}
    EILKURIER_LLM_EXTRA_BODY: ${EILKURIER_LLM_EXTRA_BODY:-{}}
    # Zustellung
    EILKURIER_TELEGRAM_BOT_TOKEN: ${EILKURIER_TELEGRAM_BOT_TOKEN:-}
    EILKURIER_SMTP_HOST: ${EILKURIER_SMTP_HOST:-}
    EILKURIER_SMTP_PORT: ${EILKURIER_SMTP_PORT:-587}
    EILKURIER_SMTP_USER: ${EILKURIER_SMTP_USER:-}
    EILKURIER_SMTP_PASSWORD: ${EILKURIER_SMTP_PASSWORD:-}
    EILKURIER_SMTP_FROM: ${EILKURIER_SMTP_FROM:-Eilkurier <eilkurier@localhost>}
    EILKURIER_SMTP_STARTTLS: ${EILKURIER_SMTP_STARTTLS:-true}
    # Pipeline
    EILKURIER_FETCH_INTERVAL_MINUTES: ${EILKURIER_FETCH_INTERVAL_MINUTES:-30}
    EILKURIER_ARTICLE_RETENTION_DAYS: ${EILKURIER_ARTICLE_RETENTION_DAYS:-60}
    EILKURIER_STORY_WINDOW_DAYS: ${EILKURIER_STORY_WINDOW_DAYS:-14}
  # Zustandslose Container: Root-Dateisystem schreibgeschützt, keine Rechte; alles liegt in Postgres.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *eilkurier
    restart: "no"
    command: ["eilkurier", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *eilkurier
    ports:
      - "${EILKURIER_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    <<: *eilkurier
    command: ["eilkurier", "worker"]
    stop_grace_period: 60s
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      POSTGRES_DB: eilkurier
      POSTGRES_USER: eilkurier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}
    # Bewusst klein: der Pi teilt sich CPU und RAM mit anderen Diensten.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c max_connections=20
    volumes:
      # Fester Pfad auf der SSD (OMV-Freigabe), z. B. /srv/dev-disk-by-uuid-XXXX/appdata/eilkurier/db
      - ${EILKURIER_DB_DIR:?EILKURIER_DB_DIR auf einen Ordner der SSD setzen}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eilkurier -d eilkurier"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.13
      - image: pgvector/pgvector:pg17
        environment:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
    environment:
      EILKURIER_TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install --user uv
      - restore_cache:
          keys:
            - uv-{{ checksum "uv.lock" }}
      - run:
          name: Install dependencies
          command: uv sync --locked
      - save_cache:
          key: uv-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Lint
          command: |
            uv run ruff check .
            uv run ruff format --check .
      - run:
          name: Wait for Postgres
          command: |
            for i in $(seq 1 30); do
              uv run python -c "import psycopg; psycopg.connect('postgresql://test:test@localhost:5432/test').close()" && exit 0
              sleep 1
            done
            exit 1
      - run:
          name: Tests (pipeline against Postgres, API, PDF/UA-1 typesetting of all themes)
          command: uv run pytest --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

  web:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-{{ checksum "frontend/package-lock.json" }}
      - run:
          name: Install
          command: cd frontend && npm ci --no-audit --no-fund
      - save_cache:
          key: npm-{{ checksum "frontend/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Typecheck + a11y lint (svelte-check, warnings fail the build)
          command: cd frontend && npm run check
      - run:
          name: Build
          command: cd frontend && npm run build

  image:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Enable arm64 emulation for multi-arch builds
          command: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - run:
          name: Check that the tag matches the version in pyproject.toml
          command: |
            code=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
            if [ "v$code" != "$CIRCLE_TAG" ]; then
              echo "Tag $CIRCLE_TAG does not match version $code in pyproject.toml" >&2
              exit 1
            fi
      - run:
          name: Build and push multi-arch image to Docker Hub (X.Y.Z, X.Y, X, latest)
          command: |
            version="${CIRCLE_TAG#v}"
            minor="${version%.*}"
            major="${version%%.*}"
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker buildx create --use --name multiarch
            docker buildx build \
              --platform linux/arm64,linux/amd64 \
              --build-arg VERSION="$version" \
              --build-arg REVISION="$CIRCLE_SHA1" \
              --tag "hablijack/eilkurier-ng:$version" \
              --tag "hablijack/eilkurier-ng:$minor" \
              --tag "hablijack/eilkurier-ng:$major" \
              --tag hablijack/eilkurier-ng:latest \
              --push .

workflows:
  build:
    jobs:
      # Every branch and every tag is tested; only release tags vX.Y.Z build and push images.
      - test:
          filters:
            tags:
              only: /.*/
      - web:
          filters:
            tags:
              only: /.*/
      - image:
          requires: [test, web]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/

; llama-server router presets for Eilkurier (one port, model chosen by the request "model" field).
version = 1

[*]
; Unified memory (8 GB shared by CPU and GPU): no host-side prompt cache, few checkpoints, no auto-fit.
cache-ram = 0
ctx-checkpoints = 1
fit = off
np = 1
fa = on
load-mode = none
load-on-startup = true

[qwen3.5-9b]
; Reporter: Qwen3.5-9B IQ4_XS, thinking off; 4096 tokens = 6000-char article + prompt + answer.
model = /models/Qwen3.5-9B-IQ4_XS.gguf
ngl = 99
c = 4096
reasoning = off

[embeddinggemma]
; Story matching: EmbeddingGemma 300M on the CPU (a second CUDA context would cost ~0.6 GB of shared memory).
; Input is headline + summary (< 250 tokens), so 512 tokens suffice.
model = /models/embeddinggemma-300M-Q8_0.gguf
embedding = true
device = none
ngl = 0
c = 512
b = 512
ub = 512
; CPU: map the weights from disk instead of copying them, no repacked second copy.
load-mode = mmap
no-repack = true

# Eilkurier – Betrieb im Heimnetz (z. B. openmediavault Compose-Plugin auf dem Raspberry Pi).
# Konfiguration über .env (Vorlage: .env.example).
name: eilkurier

services:
  app:
    image: hablijack/eilkurier-ng:${EILKURIER_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${EILKURIER_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
    # Stateless container: read-only root filesystem, no privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Ab Meilenstein 1: Stammdaten, Artikel, Embeddings (pgvector) und Job-Warteschlange.
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      POSTGRES_DB: eilkurier
      POSTGRES_USER: eilkurier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    # Bewusst klein: der Pi teilt sich CPU und RAM mit anderen Diensten.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c max_connections=20
    volumes:
      - ${EILKURIER_DB_DIR:-db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eilkurier -d eilkurier"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  db:
